services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: onlinejudge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  # Judge0 - The heart of the OJ (Sandbox)
  # We will use the CE (Community Edition) version
  judge0:
    image: judge0/judge0:latest
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=onlinejudge
    ports:
      - "2358:2358"
    depends_on:
      - db
      - redis
  judge0-worker:
    image: judge0/judge0:latest
    privileged: true
    security_opt:
      - seccomp=unconfined
    restart: always
    command: ["./scripts/workers"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=onlinejudge
    depends_on:
      - db
      - redis
      - judge0

volumes:
  postgres_data:
